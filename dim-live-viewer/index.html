function splitTableRow(line){
  let s = String(line || '').trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0, -1);
  return s.split('|').map(x => x.trim());
}
function isTableSeparator(line){
  const cells = splitTableRow(line);
  return cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
}
function tableHtml(header, align, rows){
  const alignClass = i => {
    const a = align[i] || '';
    return a.startsWith(':') && a.endsWith(':') ? 'center'
      : a.endsWith(':') ? 'right' : a.startsWith(':') ? 'left' : '';
  };
  const th = header.map((cell, i) =>
    '<th' + (alignClass(i) ? ' style="text-align:' + alignClass(i) + '"' : '') + '>' +
    inlineMarkdown(cell) + '</th>').join('');
  const body = rows.map(row => '<tr>' + header.map((_, i) =>
    '<td' + (alignClass(i) ? ' style="text-align:' + alignClass(i) + '"' : '') + '>' +
    inlineMarkdown(row[i] || '') + '</td>').join('') + '</tr>').join('');
  return '<div class="md-table-wrap"><table class="md-table"><thead><tr>' + th +
    '</tr></thead><tbody>' + body + '</tbody></table></div>';
}
function isBlockStart(lines, i){
  const line = lines[i] || '';
  if (!line.trim()) return true;
  if (/^\s*(```+|~~~+)/.test(line)) return true;
  if (/^\s*#{1,6}\s+/.test(line)) return true;
  if (/^\s*>/.test(line)) return true;
  if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) return true;
  if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) return true;
  if (/^\s*\$\$.+?\$\$\s*$/.test(line)) return true;
  if (/^\s*\$\$\s*$/.test(line)) return true;
  if (line.includes('|') && i + 1 < lines.length && isTableSeparator(lines[i + 1])) return true;
  return false;
}
function markdownToHtml(text){
  const lines = String(text ?? '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length){
    const line = lines[i];
    if (!line.trim()){ i++; continue; }

    const fence = line.match(/^\s*(```+|~~~+)\s*([^\s`]*)/);
    if (fence){
      const marker = fence[1][0];
      const lang = fence[2] || '';
      const body = [];
      i++;
      while (i < lines.length && !new RegExp('^\\s*' + marker + '{3,}\\s*$').test(lines[i])){
        body.push(lines[i]); i++;
      }
      if (i < lines.length) i++;
      out.push(codeBlockHtml(lang, body.join('\n')));
      continue;
    }

    const sameLineMath = line.match(/^\s*\$\$(.+?)\$\$\s*$/);
    if (sameLineMath){
      out.push('<div class="math-block">' + texToMathML(sameLineMath[1], true) + '</div>');
      i++; continue;
    }

    if (/^\s*\$\$\s*$/.test(line)){
      const body = [];
      i++;
      while (i < lines.length && !/^\s*\$\$\s*$/.test(lines[i])){ body.push(lines[i]); i++; }
      if (i < lines.length) i++;
      out.push('<div class="math-block">' + texToMathML(body.join('\n'), true) + '</div>');
      continue;
    }

    const heading = line.match(/^\s*(#{1,6})\s+(.*)$/);
    if (heading){
      const level = heading[1].length;
      out.push('<h' + level + ' class="md-h' + level + '">' + inlineMarkdown(heading[2]) + '</h' + level + '>');
      i++; continue;
    }

    if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)){
      out.push('<hr class="md-hr">'); i++; continue;
    }

    if (line.includes('|') && i + 1 < lines.length && isTableSeparator(lines[i + 1])){
      const header = splitTableRow(line);
      const align = splitTableRow(lines[i + 1]);
      const rows = [];
      i += 2;
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()){
        rows.push(splitTableRow(lines[i])); i++;
      }
      out.push(tableHtml(header, align, rows));
      continue;
    }

    if (/^\s*>/.test(line)){
      const body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])){
        body.push(lines[i].replace(/^\s*>\s?/, '')); i++;
      }
      out.push('<blockquote class="md-quote">' + markdownToHtml(body.join('\n')) + '</blockquote>');
      continue;
    }

    const listMatch = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)$/);
    if (listMatch){
      const ordered = /^\d/.test(listMatch[1]);
      const tag = ordered ? 'ol' : 'ul';
      const items = [];
      while (i < lines.length){
        const m = lines[i].match(/^\s*([-*+]|\d+[.)])\s+(.*)$/);
        if (!m || (/^\d/.test(m[1]) !== ordered)) break;
        items.push('<li>' + inlineMarkdown(m[2]) + '</li>');
        i++;
      }
      out.push('<' + tag + ' class="md-list">' + items.join('') + '</' + tag + '>');
      continue;
    }

    const para = [line];
    i++;
    while (i < lines.length && !isBlockStart(lines, i)){ para.push(lines[i]); i++; }
    out.push('<p>' + inlineMarkdown(para.join('\n')) + '</p>');
  }
  return out.join('');
}
function prose(text){
  const div = document.createElement('div');
  div.className = 'prose';
  div.innerHTML = markdownToHtml(text);
  mountRichContent(div);
  return div;
}
function attachRichText(el, text){
  el.innerHTML = markdownToHtml(text);
  mountRichContent(el);
}

/* ---------------- 消息渲染 ---------------- */
const transcript = $('#transcript');

function transcriptInfo(m){
  const t = m && m.metadata && m.metadata['_dimTranscript'];
  return (t && typeof t === 'object') ? t : null;
}
function firstText(m){
  for (const p of (m.parts || [])) if (p.type === 'text') return p.text || '';
  return '';
}
function isHiddenUser(m){
  if (m.role !== 'user') return false;
  const t = transcriptInfo(m);
  if (t && t.visibility === 'hidden') return true;
  return /^\s*<(runtime-recovery|notification|goal_context|runtime_steer)/.test(firstText(m));
}

function msgFooter(m, who){
  const f = document.createElement('div'); f.className = 'msg-meta';
  const bits = [];
  bits.push('<span>' + (who ? esc(who) + ' · ' : '') + fmtTime(m.createdAt) + '</span>');
  bits.push('<span class="mid" title="' + esc(m.messageId) + '">' + esc(shortId(m.messageId)) + '</span>');
  const t = transcriptInfo(m);
  if (t && t.kind) bits.push('<span class="tag">' + esc(t.kind) + '</span>');
  f.innerHTML = bits.join('');
  const raw = rawJson(m);
  if (raw){
    const d = document.createElement('details'); d.className = 'raw';
    d.innerHTML = '<summary>原始数据</summary>';
    const pre = document.createElement('pre'); pre.textContent = raw;
    d.appendChild(pre); f.appendChild(d);
  }
  return f;
}
function rawJson(m){
  const o = {};
  if (m.metadata && Object.keys(m.metadata).length) o.metadata = m.metadata;
  if (m.toolMetadata && Object.keys(m.toolMetadata).length) o.toolMetadata = m.toolMetadata;
  if (m.attachments && Object.keys(m.attachments).length) o.attachments = m.attachments;
  return Object.keys(o).length ? JSON.stringify(o, null, 2) : '';
}

function thinkBlock(p){
  const txt = p.thinking || '';
  const d = document.createElement('details'); d.className = 'think';
  d.innerHTML = '<summary><span class="chev"></span><span>思考过程</span>' +
                '<span class="muted-n">' + txt.length + ' 字</span></summary>';
  const b = document.createElement('div'); b.className = 'think-body'; b.textContent = txt;
  d.appendChild(b);
  return d;
}

function summarizeTool(name, input){
  input = input || {};
  const n = String(name || '').toLowerCase();
  if (n === 'exec') return String(input.command || '').split('\n')[0].slice(0, 170);
  if (n === 'write') return String(input.path || '') + (input.content ? '  （' + String(input.content).length + ' 字）' : '');
  if (n === 'read' || n === 'edit') return String(input.path || input.file_path || '');
  if (n === 'glob' || n === 'grep') return [input.pattern, input.path].filter(Boolean).join('  ·  ');
  if (n === 'agent' || n === 'task') return String(input.prompt || input.description || '').slice(0, 150);
  if (n === 'wait') return [input.taskId, input.timeoutMs ? input.timeoutMs + 'ms' : ''].filter(Boolean).join(' · ');
  if (n === 'websearch' || n === 'web_search' || n === 'search') return '🔍 ' + String(input.query || '');
  if (n === 'webfetch' || n === 'web_fetch' || n === 'fetch') return '🌐 ' + String(input.url || '');
  for (const k of ['query', 'url', 'path', 'file_path', 'command', 'prompt', 'description', 'taskId']){
    if (input[k]) return String(input[k]).split('\n')[0].slice(0, 170);
  }
  try { return JSON.stringify(input).slice(0, 160); } catch(e){ return ''; }
}

function toolUseBlock(p){
  const name = p.name || 'tool';
  const input = (p.input && typeof p.input === 'object') ? p.input : {};
  if (p.id) state.toolNames[p.id] = name;
  const d = document.createElement('details'); d.className = 'tool';
  if (p.id) d.dataset.call = p.id;
  d.innerHTML = '<summary><span class="chev"></span><span class="t-badge">' + esc(name) +
    '</span><span class="t-sum">' + esc(summarizeTool(name, input)) + '</span>' +
    '<span class="t-state"></span></summary>';
  const body = document.createElement('div'); body.className = 'tool-body';
  if (name === 'exec' && input.command){
    const cmd = document.createElement('pre'); cmd.className = 'code cmd';
    cmd.textContent = String(input.command);
    body.appendChild(cmd);
  }
  const pre = document.createElement('pre'); pre.className = 'code';
  pre.textContent = JSON.stringify(input, null, 2);
  body.appendChild(pre);
  d.appendChild(body);
  return d;
}

function renderUser(m){
  const w = document.createElement('div'); w.className = 'msg user';
  const b = document.createElement('div'); b.className = 'bubble';
  attachRichText(b, firstText(m));
  w.appendChild(b);
  w.appendChild(msgFooter(m, '你'));
  return w;
}

function renderAssistant(m){
  const w = document.createElement('div'); w.className = 'msg assistant';
  const body = document.createElement('div'); body.className = 'a-body';
  let hasText = false;
  for (const p of (m.parts || [])){
    if (p.type === 'thinking'){
      if ((p.thinking || '').trim()) body.appendChild(thinkBlock(p));
    } else if (p.type === 'text'){
      if ((p.text || '').trim()){
        hasText = true;
        const d = document.createElement('div'); d.className = 'a-text';
        attachRichText(d, p.text);
        body.appendChild(d);
      }
    } else if (p.type === 'tool_use'){
      body.appendChild(toolUseBlock(p));
    }
  }
  if (!hasText) w.classList.add('no-final-text');
  w.appendChild(body);
  w.appendChild(msgFooter(m, '助手'));
  return w;
}

function renderToolResultMsg(m){
  const wrap = document.createElement('div'); wrap.className = 'msg toolresult-msg';
  const p = (m.parts || []).find(x => x.type === 'tool_result') || { content: '' };
  const sc = (p.structuredContent && typeof p.structuredContent === 'object') ? p.structuredContent : {};
  const callId = p.tool_use_id || '';
  if (callId) state.toolResults.add(callId);
  const name = state.toolNames[callId] || '';
  const err = p.is_error === true || sc.status === 'failed' || (sc.exitCode != null && sc.exitCode !== 0);
  const d = document.createElement('details');
  d.className = 'toolresult' + (err ? ' err' : '');
  const chips = [];
  if (sc.exitCode != null) chips.push('exit ' + sc.exitCode);
  if (sc.wallTimeMs != null) chips.push(fmtMs(sc.wallTimeMs));
  const content = typeof p.content === 'string' ? p.content
    : (p.content == null ? '' : JSON.stringify(p.content));
  if (content) chips.push(fmtBytes(content.length));
  if (sc.outputTruncated) chips.push('截断');
  if (p.is_error) chips.push('错误');
  d.innerHTML = '<summary><span class="chev"></span><span class="dot"></span>' +
    '<span>结果' + (name ? ' · ' + esc(name) : '') + '</span>' +
    chips.map(c => '<span class="mini">' + esc(c) + '</span>').join('') + '</summary>';
  const body = document.createElement('div'); body.className = 'tr-body';
  const pre = document.createElement('pre'); pre.className = 'code';
  pre.textContent = content || '（无文本输出）';
  body.appendChild(pre);
  const scKeys = Object.keys(sc);
  if (scKeys.length){
    const nested = document.createElement('details'); nested.className = 'raw';
    nested.innerHTML = '<summary>结构化数据</summary>';
    const p2 = document.createElement('pre');
    p2.textContent = JSON.stringify(sc, null, 2);
    nested.appendChild(p2);
    const outer = document.createElement('div');
    outer.style.padding = '8px 13px';
    outer.appendChild(nested);
    body.appendChild(outer);
  }
  d.appendChild(body);
  wrap.appendChild(d);
  wrap.appendChild(msgFooter(m, '工具结果'));
  if (callId){
    const sel = window.CSS && CSS.escape ? CSS.escape(callId) : callId;
    const card = transcript.querySelector('.tool[data-call="' + sel + '"]');
    if (card){ card.classList.add('done'); card.classList.remove('pending'); }
  }
  return wrap;
}

function renderSysMsg(m){
  const w = document.createElement('details'); w.className = 'sysmsg';
  const t = transcriptInfo(m);
  const txt = firstText(m);
  const label = (t && t.kind) ? t.kind : (m.role === 'user' ? '运行时消息' : m.role);
  const first = txt.split('\n').find(l => l.trim()) || '';
  w.innerHTML = '<summary><span class="chev"></span><span class="sys-tag">' + esc(label) +
    '</span><span>' + esc(first.slice(0, 120)) + '</span></summary>';
  const b = document.createElement('div'); b.className = 'sys-body'; b.textContent = txt;
  w.appendChild(b);
  w.appendChild(msgFooter(m, ''));
  return w;
}

function renderMessage(m){
  if (m.role === 'user') return isHiddenUser(m) ? renderSysMsg(m) : renderUser(m);
  if (m.role === 'assistant') return renderAssistant(m);
  if (m.role === 'tool_result') return renderToolResultMsg(m);
  return renderSysMsg(m);
}

function markFinalAssistant(){
  const assistants = [...transcript.querySelectorAll('.msg.assistant')];
  for (const el of assistants) el.classList.remove('last-final');
  for (let i = assistants.length - 1; i >= 0; i--){
    if (assistants[i].querySelector('.a-text')){
      assistants[i].classList.add('last-final');
      break;
    }
  }
}

/* ---------------- 运行态 ---------------- */
function refreshPending(){
  const s = state.sessions.find(x => x.id === state.currentId);
  const live = isLive(s);
  transcript.querySelectorAll('.tool[data-call]').forEach(el => {
    const call = el.dataset.call;
    const done = call && state.toolResults.has(call);
    el.classList.toggle('done', !!done);
    el.classList.toggle('pending', !done && live);
    const st = el.querySelector('.t-state');
    if (st) st.textContent = done ? '完成' : (live ? '执行中…' : '未返回');
  });
}

/* ---------------- 正文读写 ---------------- */
function nearBottom(){
  return transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 120;
}
// 瞬时贴底：平滑滚动会被新到达的消息打断，视图会停在半路（表现为"自动滚动没跟上"）
function scrollToBottom(){
  transcript.scrollTop = transcript.scrollHeight;
  state.pinned = true;
  $('#toBottom').classList.add('hidden');
}
function setAutoScroll(on){
  state.autoScroll = on;
  $('#autoScrollState').textContent = on ? '开' : '关';
  $('#autoScrollBtn').classList.toggle('on', on);
  $('#autoScrollBtn').title = '有新消息时自动滚动到底部（当前：' + (on ? '开' : '关') + '）';
  if (on) scrollToBottom();
}
transcript.addEventListener('scroll', () => {
  state.pinned = nearBottom();
  if (state.pinned) $('#toBottom').classList.add('hidden');
});

async function loadMessages(initial){
  const id = state.currentId;
  if (!id) return;
  const selected = state.sessions.find(s => s.id === id);
  const source = selected ? engineOf(selected) : '';
  let data;
  try {
    data = await api('/api/messages?session=' + encodeURIComponent(id) +
      '&source=' + encodeURIComponent(source) + '&offset=' + state.offset);
    setConn(true);
  } catch (e){
    setConn(false);
    return;
  }
  if (state.currentId !== id) return;
  if (data.total < state.offset){
    state.offset = 0;
    state.toolNames = {};
    state.toolResults = new Set();
    transcript.innerHTML = '';
    return loadMessages(true);
  }
  const stick = state.autoScroll && state.pinned;
  if (data.messages.length){
    const empty = transcript.querySelector('.empty');
    if (empty) empty.remove();
    const frag = document.createDocumentFragment();
    for (const m of data.messages) frag.appendChild(renderMessage(m));
    transcript.appendChild(frag);
    state.offset += data.messages.length;
    markFinalAssistant();
    refreshPending();
    if (initial || stick) scrollToBottom();
    else $('#toBottom').classList.remove('hidden');
  } else if (initial){
    transcript.innerHTML = '<div class="empty"><div class="spark">✳</div>' +
      '<div class="empty-title">这个会话还没有消息</div><div class="empty-sub">等待消息写入…</div></div>';
  }
}

/* ---------------- 轮询 ---------------- */
function setConn(ok){
  if (state.connected !== ok){
    state.connected = ok;
    $('#conn').classList.toggle('bad', !ok);
    $('#connText').textContent = ok ? '已连接' : '连接断开';
  }
  if (!ok){
    const d = document.getElementById('bootDiag');
    if (d != null) d.textContent = diagText();
  }
}

async function pollSessions(){
  try {
    const data = await api('/api/sessions');
    setConn(true);
    state.sessions = data.sessions || [];
    renderEngineSwitch();
    updateAncestors();
    if (!state.currentId || !state.sessions.some(s => s.id === state.currentId)){
      if (state.sessions.length) selectSession(state.sessions[0].id);
    }
    renderSidebar();
    updateHead();
    refreshPending();
    state.booted = true;
  } catch (e){
    setConn(false);
  }
}

async function pollMessages(){
  if (!state.currentId || document.hidden) return;
  await loadMessages(false);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden){ pollSessions(); pollMessages(); }
});

/* ---------------- 启动 ---------------- */
$('#toBottom').onclick = () => setAutoScroll(true);
$('#autoScrollBtn').onclick = () => setAutoScroll(!state.autoScroll);
$('#menuBtn').onclick = toggleDrawer;
$('#sideCloseBtn').onclick = closeDrawer;
backdropEl.onclick = closeDrawer;
$('#imgLightboxClose').onclick = () => $('#imgLightbox').classList.add('hidden');
$('#imgLightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.add('hidden');
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const lightbox = $('#imgLightbox');
  if (lightbox && !lightbox.classList.contains('hidden')){
    lightbox.classList.add('hidden');
    return;
  }
  closeDrawer();
});
window.addEventListener('resize', () => { if (!isNarrow()) closeDrawer(); });
setAutoScroll(true);
applyFinalOnly(state.finalOnly);
updateSearchButtons();
renderEngineSwitch();
transcript.innerHTML = '<div class="empty"><div class="spark">✳</div>' +
  '<div class="empty-title">正在连接 DimAgent 数据…</div>' +
  '<div class="empty-sub" id="bootDiag" style="max-width:560px;margin:10px auto 0;user-select:text"></div></div>';
const bootDiagEl = document.getElementById('bootDiag');
if (bootDiagEl) bootDiagEl.textContent = diagText();
if (IN_SANDBOX){
  const kick = () => pollSessions();
  globalThis.addEventListener('openai:set_globals', kick);
  globalThis.addEventListener('webplus:set_globals', kick);
}
pollSessions();
setInterval(pollSessions, 3000);
setInterval(pollMessages, 1500);
})();
